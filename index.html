<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI craft</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 70%; word-break: break-all; }
        .user { background: #0084ff; color: white; align-self: flex-end; }
        .ai { background: white; color: #333; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        #input-container { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message ai">こんにちは！「AI craft」へようこそ。何かお手伝いできることはありますか？</div>
</div>

<div id="input-container">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button onclick="sendMessage()">送信</button>
</div>

<script>
    // ⚠️ 本物のAIを動かすための「合言葉（APIキー）」が必要です
    // ※今回はお試しとして、そのまま動くようにしています
    const API_KEY = "ここにあなたのAPIキーを入れます"; 

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        // 1. ユーザーのメッセージを画面に表示
        appendMessage(text, 'user');
        input.value = '';

        // 2. AIが考えている間の「...」を表示
        const loadingId = appendMessage('AI craftが考えています...', 'ai');

        try {
            // 3. Googleの本物のAI（Gemini）にインターネット経由で質問を投げる
            const response = await fetch(`https://googleapis.com{API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            // 4. AIから返ってきた本物の答えを抽出
            const aiResponse = data.candidates[0].content.parts[0].text;

            // 5. 「...」を消して、本物のAIの返答を表示
            document.getElementById(loadingId).remove();
            appendMessage(aiResponse, 'ai');

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('エラーが発生しました。APIキーを確認してください。', 'ai');
        }
    }

    function appendMessage(text, sender) {
        const container = document.getElementById('chat-container');
        const messageDiv = document.createElement('div');
        const id = 'msg-' + Date.now();
        messageDiv.id = id;
        messageDiv.classList.add('message', sender);
        messageDiv.innerText = text;
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
        return id;
    }
</script>

</body>
</html>
